<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SOLI - Le Complice de votre Mission Sociale" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>SOLI | Le Complice de votre Mission Sociale</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;700&family=Permanent+Marker&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --mdj-dark: #0f172a;
      --mdj-cyan: #00FFFF;
    }

    body {
      margin: 0;
      background-color: var(--mdj-dark);
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--mdj-dark);
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .spinner-large {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(0, 255, 255, 0.1);
      border-left-color: var(--mdj-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.4));
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .dark {
      color-scheme: dark;
    }
  </style>

  <script>
    (function () {
      try {
        const theme = localStorage.getItem('theme');
        const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <img
      src="https://mdjescalejeunesse.ca/wp-content/uploads/2024/01/logo-du-planner-no-frame-l039escale-jeunesse-la-piaule.png"
      alt="SOLI"
      style="width: 250px; height: auto; margin-bottom: 3rem; filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.2));">
    <div class="spinner-large" id="loading-spinner"></div>
    <p id="loading-text"
      style="margin-top: 2rem; font-size: 1.25rem; color: #94a3b8; font-family: 'Montserrat', sans-serif;">
      Initialisation du système...
    </p>
  </div>

  <div id="root"></div>

  <noscript>
    <div style="padding: 2rem; text-align: center; color: white; font-family: sans-serif;">
      <h1>⚠️</h1>
      <p>JavaScript doit être activé pour utiliser cette application.</p>
    </div>
  </noscript>

  <script type="module" src="/index.tsx"></script>
</body>

</html>
